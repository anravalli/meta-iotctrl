# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-iotctrl"
BBFILE_PATTERN_meta-iotctrl = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-iotctrl = "9"

LAYERDEPENDS_meta-iotctrl = "core"
LAYERSERIES_COMPAT_meta-iotctrl = "walnascar"
